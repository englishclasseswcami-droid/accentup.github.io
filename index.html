<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AccentUp — Sound Explorer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --brand: #2D2AE8; --brand-light: #EEEDFE; --brand-mid: #534AB7; --brand-dark: #1a18a0;
  --accent: #F5C4B3; --accent-dark: #D85A30;
  --bg: #F7F7FB; --surface: #FFFFFF;
  --text: #14141F; --text-muted: #6B6B80; --text-light: #A0A0B5;
  --border: rgba(0,0,0,0.08); --radius: 14px; --radius-sm: 8px;
  --green: #1D9E75; --green-light: #E1F5EE; --green-dark: #085041;
  --red: #D85A30; --red-light: #FAECE7; --red-dark: #4A1B0C;
}
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

/* NAV */
nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 1.5rem; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; gap: 1rem; }
.logo { font-size: 20px; font-weight: 800; color: var(--brand); letter-spacing: -0.5px; white-space: nowrap; }
.logo span { color: var(--accent-dark); }
.nav-tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.nav-tab { padding: 7px 15px; border-radius: 30px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; background: transparent; color: var(--text-muted); transition: all .18s; white-space: nowrap; }
.nav-tab:hover { background: var(--brand-light); color: var(--brand); }
.nav-tab.active { background: var(--brand); color: #fff; }
.nav-tab.teacher-tab { border: 1.5px dashed var(--border); }
.nav-tab.teacher-tab.active { background: var(--accent-dark); border-color: var(--accent-dark); color: #fff; }
.nav-tab.auth-btn { background: var(--brand); color: #fff; font-weight: 600; }
.nav-tab.auth-btn:hover { background: var(--brand-dark); color: #fff; }
.nav-tab.logout-btn-nav { background: var(--red-light); color: var(--red-dark); }
.nav-tab.logout-btn-nav:hover { background: var(--red); color: #fff; }

/* HERO */
.hero { background: var(--brand); color: #fff; padding: 3rem 2rem 2.5rem; text-align: center; }
.hero-label { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; opacity: .65; margin-bottom: 10px; }
.hero h1 { font-size: clamp(24px, 4vw, 42px); font-weight: 800; letter-spacing: -1px; line-height: 1.15; margin-bottom: 12px; }
.hero h1 em { color: var(--accent); font-style: normal; }
.hero p { font-size: 15px; opacity: .75; max-width: 500px; margin: 0 auto; line-height: 1.6; }

/* PAGES */
.page { display: none; padding: 2rem 1.5rem; max-width: 920px; margin: 0 auto; }
.page.active { display: block; }
.section-intro { margin-bottom: 1.75rem; }
.section-intro h2 { font-size: 20px; font-weight: 800; color: var(--brand); margin-bottom: 5px; letter-spacing: -.3px; }
.section-intro p { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

/* SOUND GRID */
.sound-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; margin-bottom: 2rem; }
.sound-card { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 1rem .9rem .9rem; cursor: pointer; transition: border-color .15s, transform .1s; text-align: center; }
.sound-card:hover { border-color: var(--brand); transform: translateY(-2px); }
.sound-card.active { border-color: var(--brand); background: var(--brand-light); }
.sound-ipa { font-size: 24px; font-weight: 700; color: var(--brand); line-height: 1; margin-bottom: 4px; }
.sound-mw { font-size: 12px; font-weight: 600; color: var(--accent-dark); margin-bottom: 3px; font-family: monospace; }
.sound-example { font-size: 11px; color: var(--text-muted); margin-bottom: 6px; }
.sound-type-badge { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 20px; }
.badge-vowel { background: #E1F5EE; color: #0F6E56; }
.badge-diphthong { background: #FAEEDA; color: #633806; }
.badge-rcolored { background: #EEEDFE; color: #3C3489; }
.badge-consonant { background: #FAECE7; color: #712B13; }

/* PLAY BUTTON */
.play-btn { display: inline-flex; align-items: center; gap: 5px; margin-top: 7px; padding: 4px 10px; border-radius: 20px; border: 1.5px solid var(--border); background: var(--surface); font-size: 11px; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: all .15s; }
.play-btn:hover { border-color: var(--brand); color: var(--brand); background: var(--brand-light); }
.play-btn svg { width: 10px; height: 10px; fill: currentColor; }

/* DETAIL PANEL */
.detail-panel { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 2rem; min-height: 140px; }
.detail-empty { color: var(--text-light); font-size: 14px; text-align: center; padding: 2.5rem 0; }
.detail-header { display: flex; align-items: center; gap: 16px; margin-bottom: 1rem; flex-wrap: wrap; }
.detail-big-ipa { font-size: 52px; font-weight: 800; color: var(--brand); line-height: 1; }
.detail-big-mw { font-size: 20px; font-weight: 700; color: var(--accent-dark); font-family: monospace; }
.detail-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
.detail-keyword { font-size: 13px; color: var(--text-muted); }
.detail-body { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; margin-top: .5rem; }
@media(max-width:560px){ .detail-body { grid-template-columns: 1fr; } }
.detail-section { background: var(--bg); border-radius: var(--radius-sm); padding: .85rem .9rem; }
.detail-section-label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--text-light); margin-bottom: 7px; }
.words-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
.word-pill { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 3px 10px; font-size: 12px; color: var(--text); }
.word-pill.highlight { background: var(--brand); color: #fff; border-color: var(--brand); }
.tip-box { margin-top: .9rem; background: var(--brand-light); border-radius: var(--radius-sm); padding: .85rem .9rem; border-left: 3px solid var(--brand); }
.tip-label { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--brand-mid); margin-bottom: 4px; }
.tip-text { font-size: 13px; color: #26215C; line-height: 1.6; }
.sub-heading { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-light); margin: 1.75rem 0 .9rem; display: flex; align-items: center; gap: 10px; }
.sub-heading::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── GATES (Teacher / Auth) ── */
.gate { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; text-align: center; }
.gate h2 { font-size: 20px; font-weight: 800; color: var(--accent-dark); margin-bottom: 6px; }
.gate p { font-size: 13px; color: var(--text-muted); margin-bottom: 1.5rem; }
.gate-form { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.gate-input { padding: 9px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'Inter',sans-serif; outline: none; transition: border-color .15s; width: 200px; }
.gate-input:focus { border-color: var(--brand); }
.gate-btn { padding: 9px 18px; border-radius: var(--radius-sm); background: var(--brand); color: #fff; font-size: 14px; font-weight: 700; border: none; cursor: pointer; }
.gate-error { margin-top: 10px; font-size: 13px; color: var(--red); display: none; }

/* ── TEACHER DASHBOARD ── */
.teacher-ui { display: none; }
.teacher-ui.visible { display: block; }
.teacher-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 10px; }
.teacher-header h2 { font-size: 20px; font-weight: 800; color: var(--accent-dark); }
.logout-btn { padding: 6px 14px; border-radius: 20px; border: 1.5px solid var(--border); background: transparent; font-size: 12px; font-weight: 600; color: var(--text-muted); cursor: pointer; }
.logout-btn:hover { border-color: var(--red); color: var(--red); }

.teacher-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; }
@media(max-width:680px){ .teacher-layout { grid-template-columns: 1fr; } }

.t-panel { background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
.t-panel h3 { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: .9rem; }
.field-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-light); margin-bottom: 5px; margin-top: .9rem; }
.field-label:first-of-type { margin-top: 0; }
select, textarea, input[type=text], input[type=password], input[type=email] { width: 100%; padding: 8px 11px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: 'Inter',sans-serif; font-size: 13px; color: var(--text); background: var(--bg); outline: none; transition: border-color .15s; }
select:focus, textarea:focus, input:focus { border-color: var(--brand); background: #fff; }
textarea { resize: vertical; min-height: 70px; line-height: 1.5; }

/* QUESTION BUILDER */
.q-builder { margin-top: .9rem; }
.q-row { background: var(--bg); border-radius: var(--radius-sm); padding: .75rem .85rem; margin-bottom: 8px; position: relative; }
.q-row-label { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-light); margin-bottom: 6px; }
.q-row input, .q-row textarea { margin-bottom: 5px; }
.remove-q { position: absolute; top: 8px; right: 8px; background: none; border: none; color: var(--text-light); font-size: 16px; cursor: pointer; line-height: 1; padding: 2px 6px; }
.remove-q:hover { color: var(--red); }
.add-q-btn { width: 100%; padding: 8px; border: 1.5px dashed var(--border); border-radius: var(--radius-sm); background: transparent; font-size: 13px; color: var(--text-muted); cursor: pointer; font-family: 'Inter',sans-serif; transition: all .15s; margin-top: 4px; }
.add-q-btn:hover { border-color: var(--brand); color: var(--brand); }

.primary-btn { width: 100%; padding: 10px; border-radius: var(--radius-sm); background: var(--brand); color: #fff; font-size: 14px; font-weight: 700; border: none; cursor: pointer; margin-top: 1rem; transition: background .15s; }
.primary-btn:hover { background: var(--brand-dark); }
.secondary-btn { width: 100%; padding: 9px; border-radius: var(--radius-sm); background: transparent; border: 1.5px solid var(--border); color: var(--text-muted); font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; font-family: 'Inter',sans-serif; transition: all .15s; }
.secondary-btn:hover { border-color: var(--accent-dark); color: var(--accent-dark); }

/* EXERCISE LIST (teacher) */
.ex-list-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: var(--bg); border-radius: var(--radius-sm); margin-bottom: 7px; border: 1.5px solid transparent; transition: border-color .15s; cursor: pointer; }
.ex-list-item:hover { border-color: var(--brand); }
.ex-list-item-info .name { font-size: 13px; font-weight: 700; color: var(--text); }
.ex-list-item-info .meta { font-size: 11px; color: var(--text-muted); margin-top: 1px; }
.ex-list-actions { display: flex; gap: 6px; align-items: center; }
.icon-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 8px; font-size: 12px; cursor: pointer; color: var(--text-muted); transition: all .15s; font-family: 'Inter',sans-serif; }
.icon-btn:hover { border-color: var(--brand); color: var(--brand); }
.icon-btn.del:hover { border-color: var(--red); color: var(--red); }

/* DOWNLOAD BAR */
.download-bar { background: var(--brand-light); border: 1.5px solid var(--brand); border-radius: var(--radius); padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; margin-top: 1.25rem; flex-wrap: wrap; gap: 10px; }
.download-bar p { font-size: 13px; color: var(--brand-mid); font-weight: 500; }
.download-bar p strong { color: var(--brand); }
.dl-btn { padding: 9px 20px; border-radius: var(--radius-sm); background: var(--accent-dark); color: #fff; font-size: 13px; font-weight: 700; border: none; cursor: pointer; transition: background .15s; white-space: nowrap; }
.dl-btn:hover { background: #b84c24; }

/* ── STUDENT EXERCISES PAGE ── */
.exercises-intro { margin-bottom: 1.5rem; }
.exercises-intro h2 { font-size: 20px; font-weight: 800; color: var(--brand); margin-bottom: 5px; }
.exercises-intro p { font-size: 13px; color: var(--text-muted); line-height: 1.6; }

.task-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom:
